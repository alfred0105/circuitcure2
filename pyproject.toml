[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitcare-symptom-diagnosis"
version = "0.1.0"
description = "Connection-optional PCB symptom diagnosis module"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circuitcare = ["symptom_diagnosis/knowledge/*.yaml"]
