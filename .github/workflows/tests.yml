name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_prism_benchmark:
        description: Run the pinned 12-board PRISM benchmark
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'apps/pcb-component-recognition/**'
              - 'tests/**'
              - 'scripts/**'
              - 'experiments/connectivity_candidates/**'
              - 'pyproject.toml'
              - 'requirements-macos-arm64*.txt'
              - 'README.md'
              - 'setup.cfg'
              - '.github/workflows/**'
  python:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,ui,vision,vision-ocr,datasheet,connectivity]"
      - run: python -m pytest -q -m "not integration and not stress and not crash_injection and not optional_circuit and not model_performance"
  optional-circuit-regression:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,ui,vision,vision-ocr,datasheet,connectivity]"
      - run: python -m pytest -q -m optional_circuit
  connectivity-validation:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,connectivity]"
      - run: python -m pytest -q tests/test_connectivity_candidates.py
  ngspice-integration:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    # ubuntu-latest currently resolves to 26.04 in hosted CI; its Resolute
    # mirrors failed DNS resolution repeatedly in the ngspice install job.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ngspice (retry transient Ubuntu mirror failures)
        shell: bash
        run: |
          set -uo pipefail
          installed=false
          for attempt in 1 2 3; do
            echo "ngspice install attempt ${attempt}/3"
            if timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ngspice; then
              installed=true
              break
            else
              status=$?
            fi
            echo "apt-get attempt ${attempt} failed with exit code ${status}" >&2
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ "${installed}" != true ]; then
            echo "ngspice installation failed after 3 attempts" >&2
            exit 1
          fi
          ngspice --version
      - run: python -m pip install -e ".[dev,ui,vision,vision-ai,vision-ocr,datasheet,connectivity]"
      - run: python -m pytest -q -m "integration and not model_performance"
  bounded-stress:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,ui,vision,datasheet,connectivity]"
      - run: python -m pytest -q -m stress
  native-ocr-inference:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CIRCUITCARE_REQUIRE_NATIVE_INFERENCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,vision,vision-ocr]"
      - run: python -m pytest -q -m integration tests/test_native_integration.py -k ocr
  isolated-crash-injection:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,ui,vision,datasheet,connectivity]"
      - run: python -m pytest -q -m crash_injection -rs
  prism-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_prism_benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/checkout@v4
        with:
          repository: KamMalinski/PRISM
          ref: 9189c87bbec6995b745b809db99cef6d3269401f
          path: data/external/prism
          sparse-checkout: |
            Dataset
            evaluation
            LICENSE.txt
          sparse-checkout-cone-mode: true
      - run: python -m pip install -e ".[dev,vision]"
      - run: python scripts/benchmark_prism.py --all --baseline-only --output-dir "$RUNNER_TEMP/prism-baseline"
      - run: python scripts/calibrate_prism.py --all --mode AUTO_REGISTRATION --artifact-dir "$RUNNER_TEMP/phase21_1_2"
      - run: python scripts/validate_registration.py --registration "$RUNNER_TEMP/phase21_1_2/summary.json" --output "$RUNNER_TEMP/phase21_1_2/validation.json"
      - run: python scripts/build_pcb_reference.py --all --registration "$RUNNER_TEMP/phase21_1_2/summary.json" --output-dir "$RUNNER_TEMP/phase21_1_2/projected_references"
      - uses: actions/upload-artifact@v4
        with:
          name: prism-registration-summary
          path: |
            ${{ runner.temp }}/phase21_1_2/summary.json
            ${{ runner.temp }}/phase21_1_2/validation.json
            ${{ runner.temp }}/phase21_1_2/projected_references/summary.json
          if-no-files-found: error
